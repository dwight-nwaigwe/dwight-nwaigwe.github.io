baseURL: "https://dwight-nwaigwe.github.io/"
theme: PaperMod

params:
  homeInfoParams:
    Title: "My name is Dwight, welcome to my blog"
    Content: "Notes and expositions on machine learning topics. Coming Soon!"

  socialIcons:
    - name: "github"
      url: "https://github.com/dwight-nwaigwe"

  math: true
  
markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          inline:
            - ['$', '$']
            - ['\(', '\)']
          block:
            - ['$$', '$$']
            - ['\[', '\]']

module:
  imports:
    - path: github.com/mcanouil/hugo-cite
steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      # IMPORTANT: Setup Go MUST come before Hugo runs
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build with Hugo
        run: hugo --minify
