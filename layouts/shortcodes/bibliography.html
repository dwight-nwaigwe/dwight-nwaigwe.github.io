<div class="bibliography">
  <h3>References</h3>
  <ol>
    {{ range .Page.Params.references }}
      <li>{{ .title }} — <em>{{ .author }}</em> ({{ .year }})</li>
    {{ else }}
      {{ range site.Data.references }}
        <li>{{ .title }} — <em>{{ .author }}</em> ({{ .year }})</li>
      {{ end }}
    {{ end }}
  </ol>
</div>
